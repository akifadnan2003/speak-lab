name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --reporter=dot
      - name: Require production Supabase configuration
        # The site must never ship without a backend: the app would fail closed (login only),
        # which is safe but useless. Fail the deploy loudly instead.
        run: |
          if [ -z "${{ vars.VITE_SUPABASE_URL }}" ] || [ -z "${{ vars.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Repository variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be set."
            exit 1
          fi
          case "${{ vars.VITE_SUPABASE_ANON_KEY }}" in
            sb_secret_*) echo "::error::VITE_SUPABASE_ANON_KEY must be the publishable key, never a secret key."; exit 1 ;;
          esac
      - name: Build
        run: npm run build
        env:
          # Custom domain at the site root: https://speaklab.akiflabs.net/ (public/CNAME keeps the
          # domain attached; ADR-020). The old project-site URL redirects here.
          VITE_BASE_PATH: /
          # Public values only (publishable key). The build refuses VITE_UI_PREVIEW alongside these.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Verify no secret key reached the bundle
        # supabase-js itself contains the bare prefix "sb_secret_" in a key-format check, so match
        # the shape of an actual key (prefix followed by a long token), and also the legacy
        # service-role JWT claim.
        run: |
          if grep -rqE 'sb_secret_[A-Za-z0-9_-]{20,}' dist/assets; then echo "::error::secret key found in bundle"; exit 1; fi
          if grep -rqE '"role":"service_role"|service_role' dist/assets; then echo "::error::service-role material found in bundle"; exit 1; fi
      - name: Verify the build is rooted at the custom domain
        # Nothing may still point at the old project-site path, and the CNAME must ship with the
        # artifact so the custom domain survives every deployment.
        run: |
          if grep -rq '/speak-lab/' dist/index.html dist/manifest.webmanifest dist/sw.js dist/assets; then echo "::error::old /speak-lab/ base path found in the build"; exit 1; fi
          test "$(cat dist/CNAME)" = "speaklab.akiflabs.net" || { echo "::error::dist/CNAME missing or wrong"; exit 1; }
      - name: Add SPA fallbacks
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
